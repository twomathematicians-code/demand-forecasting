<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#533483;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="line1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#533483;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#e94560;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#533483;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bg)" />

  <!-- Grid pattern -->
  <g opacity="0.03" stroke="white" stroke-width="0.5">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="200" y1="0" x2="200" y2="280" />
    <line x1="400" y1="0" x2="400" y2="280" />
    <line x1="600" y1="0" x2="600" y2="280" />
    <line x1="800" y1="0" x2="800" y2="280" />
    <line x1="1000" y1="0" x2="1000" y2="280" />
  </g>

  <!-- Chart-like decorative bars (bottom) -->
  <g opacity="0.06">
    <rect x="80" y="200" width="12" height="40" rx="2" fill="white" />
    <rect x="96" y="185" width="12" height="55" rx="2" fill="white" />
    <rect x="112" y="175" width="12" height="65" rx="2" fill="white" />
    <rect x="128" y="180" width="12" height="60" rx="2" fill="white" />
    <rect x="144" y="160" width="12" height="80" rx="2" fill="white" />
    <rect x="160" y="155" width="12" height="85" rx="2" fill="white" />
    <rect x="176" y="165" width="12" height="75" rx="2" fill="white" />
    <rect x="192" y="150" width="12" height="90" rx="2" fill="white" />
    <rect x="208" y="140" width="12" height="100" rx="2" fill="white" />
    <rect x="224" y="145" width="12" height="95" rx="2" fill="white" />
    <rect x="240" y="135" width="12" height="105" rx="2" fill="white" />
    <rect x="256" y="130" width="12" height="110" rx="2" fill="white" />
    <rect x="272" y="142" width="12" height="98" rx="2" fill="white" />
    <rect x="288" y="138" width="12" height="102" rx="2" fill="white" />
    <rect x="304" y="148" width="12" height="92" rx="2" fill="white" />
    <rect x="320" y="155" width="12" height="85" rx="2" fill="white" />
  </g>

  <!-- Decorative line under title -->
  <rect x="80" y="170" width="350" height="2" rx="1" fill="url(#line1)" />

  <!-- Main Title -->
  <text x="80" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" letter-spacing="-1">
    Demand Forecasting
  </text>
  <text x="80" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="300" fill="#a0a0c0" letter-spacing="1">
    for Supply Chain
  </text>

  <!-- Subtitle -->
  <text x="80" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#707090">
    Prophet + LightGBM + SARIMA Ensemble • Production-Grade ML • Deploy in 30 Seconds
  </text>

  <!-- Right side: Three model icons -->
  <g transform="translate(620, 60)">
    <!-- Prophet -->
    <circle cx="60" cy="40" r="22" fill="#533483" opacity="0.8" />
    <text x="60" y="46" font-family="monospace" font-size="14" fill="white" text-anchor="middle" font-weight="bold">🔮</text>
    <text x="60" y="78" font-family="system-ui, sans-serif" font-size="11" fill="#8888aa" text-anchor="middle">Prophet</text>

    <!-- LightGBM -->
    <circle cx="180" cy="40" r="22" fill="#0f3460" opacity="0.8" />
    <text x="180" y="46" font-family="monospace" font-size="14" fill="white" text-anchor="middle" font-weight="bold">🌳</text>
    <text x="180" y="78" font-family="system-ui, sans-serif" font-size="11" fill="#8888aa" text-anchor="middle">LightGBM</text>

    <!-- SARIMA -->
    <circle cx="300" cy="40" r="22" fill="#e94560" opacity="0.7" />
    <text x="300" y="46" font-family="monospace" font-size="14" fill="white" text-anchor="middle" font-weight="bold">📊</text>
    <text x="300" y="78" font-family="system-ui, sans-serif" font-size="11" fill="#8888aa" text-anchor="middle">SARIMA</text>

    <!-- Ridge -->
    <line x1="82" y1="40" x2="158" y2="40" stroke="#533483" stroke-width="2" opacity="0.5" />
    <line x1="202" y1="40" x2="278" y2="40" stroke="#0f3460" stroke-width="2" opacity="0.5" />

    <!-- Ensemble result -->
    <rect x="130" y="90" width="100" height="28" rx="14" fill="url(#accent)" opacity="0.9" />
    <text x="180" y="109" font-family="system-ui, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">Ridge Stack →</text>
  </g>

  <!-- Bottom stat badges -->
  <g transform="translate(80, 225)">
    <rect x="0" y="0" width="120" height="28" rx="6" fill="#533483" opacity="0.3" />
    <text x="60" y="19" font-family="monospace" font-size="11" fill="#c0c0e0" text-anchor="middle">⚡ ~10% MAPE</text>

    <rect x="130" y="0" width="120" height="28" rx="6" fill="#0f3460" opacity="0.3" />
    <text x="190" y="19" font-family="monospace" font-size="11" fill="#c0c0e0" text-anchor="middle">🚀 &lt;100ms</text>

    <rect x="260" y="0" width="130" height="28" rx="6" fill="#e94560" opacity="0.2" />
    <text x="325" y="19" font-family="monospace" font-size="11" fill="#c0c0e0" text-anchor="middle">📊 36 Features</text>

    <rect x="400" y="0" width="100" height="28" rx="6" fill="#533483" opacity="0.25" />
    <text x="450" y="19" font-family="monospace" font-size="11" fill="#c0c0e0" text-anchor="middle">🐳 Docker</text>
  </g>
</svg>
