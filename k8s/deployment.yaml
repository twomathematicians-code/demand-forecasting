"""Kubernetes manifests for demand forecasting deployment."""

# This file documents the K8s resources. Apply with:
#   kubectl apply -f k8s/

# ── Namespace ──
# kubectl create namespace demand-forecasting

# ── ConfigMap ──
apiVersion: v1
kind: ConfigMap
metadata:
  name: demand-forecast-config
  namespace: demand-forecasting
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  DF_DB_HOST: "postgres-svc"
  DF_DB_PORT: "5432"
  DF_DB_USER: "mluser"
  DF_DB_NAME: "demand_forecasting"
  DF_KAFKA_BOOTSTRAP_SERVERS: "kafka-svc:9092"
  DF_REDIS_URL: "redis://redis-svc:6379/0"
  DF_REDIS_ENABLED: "true"
  DF_KAFKA_CONSUMER_ENABLED: "true"
  DF_DRIFT_CHECK_ENABLED: "true"
---
# ── Deployment ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demand-forecast-api
  namespace: demand-forecasting
  labels:
    app: demand-forecast-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demand-forecast-api
  template:
    metadata:
      labels:
        app: demand-forecast-api
    spec:
      containers:
      - name: api
        image: ghcr.io/twomathematicians-code/demand-forecasting:latest
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: demand-forecast-config
        - secretRef:
            name: demand-forecast-secrets
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
# ── Service ──
apiVersion: v1
kind: Service
metadata:
  name: demand-forecast-svc
  namespace: demand-forecasting
spec:
  selector:
    app: demand-forecast-api
  ports:
  - port: 80
    targetPort: 8000
    name: http
  type: ClusterIP
---
# ── HorizontalPodAutoscaler ──
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demand-forecast-hpa
  namespace: demand-forecasting
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demand-forecast-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
