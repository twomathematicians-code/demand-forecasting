# Render Blueprint — one-click deploy for demand-forecasting
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── PostgreSQL (TimescaleDB) ──
  - type: pserv
    name: demand-forecast-db
    plan: starter  # Free tier: 1GB storage
    runtime: image
    image:
      url: timescale/timescaledb:2.15-pg15
    envVars:
      - key: POSTGRES_DB
        value: demand_forecasting
      - key: POSTGRES_USER
        value: mluser
      - key: POSTGRES_PASSWORD
        generateValue: true
    disk:
      name: pgdata
      mountPath: /var/lib/postgresql/data
      sizeGB: 10

  # ── Redis (Caching) ──
  - type: redis
    name: demand-forecast-redis
    plan: free  # 25MB, shared
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all (internal network)

  # ── FastAPI Web Service ──
  - type: web
    name: demand-forecast-api
    runtime: python
    plan: starter  # Free: 512MB RAM, 0.1 CPU — upgrade to standard for production
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DF_ENVIRONMENT
        value: production
      - key: DF_DB_HOST
        fromService:
          type: pserv
          name: demand-forecast-db
          property: host
      - key: DF_DB_PORT
        fromService:
          type: pserv
          name: demand-forecast-db
          property: port
      - key: DF_DB_USER
        value: mluser
      - key: DF_DB_NAME
        value: demand_forecasting
      - key: DF_DB_PASSWORD
        fromService:
          type: pserv
          name: demand-forecast-db
          property: password  # Auto-generated secure password
      - key: DF_REDIS_URL
        fromService:
          type: redis
          name: demand-forecast-redis
          property: connectionString
      - key: DF_REDIS_ENABLED
        value: "true"
      - key: DF_KAFKA_CONSUMER_ENABLED
        value: "false"
      - key: DF_DRIFT_CHECK_ENABLED
        value: "false"
      - key: DF_MODEL_REGISTRY_PATH
        value: /var/data/models
      - key: DF_CORS_ORIGINS
        value: "https://your-frontend.vercel.app,https://your-app.netlify.app"
      - key: DF_ADMIN_API_KEY
        generateValue: true
        sync: false  # Don't sync back to repo (security)
      - key: DF_KATZILLA_API_KEY
        sync: false
        value: ""
    disk:
      name: model-storage
      mountPath: /var/data
      sizeGB: 5
    domains:
      - demand-forecast-api.onrender.com  # Auto-generated by Render
    autoDeploy: true
