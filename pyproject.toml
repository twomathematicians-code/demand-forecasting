[tool.poetry]
name = "ml-demand-forecasting"
version = "1.0.0"
description = "Demand forecasting for supply chain: LightGBM + Prophet + SARIMA ensemble for product demand, order volumes, and energy consumption."
authors = ["Mahesh Solanki"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.30"}
pydantic = "^2.7"
pydantic-settings = "^2.3"
lightgbm = "^4.3"
statsmodels = "^0.14"
prophet = "^1.1"
scikit-learn = "^1.5"
pandas = "^2.2"
numpy = "^1.26"
httpx = "^0.27"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
ruff = "^0.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
