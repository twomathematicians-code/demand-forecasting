[tool.poetry]
packages = [{include = "src"}]
name = "demand-forecasting"
version = "2.1.0"
description = "Demand forecasting for supply chain: LightGBM + Prophet + SARIMA ensemble for product demand, order volumes, and energy consumption."
authors = ["Mahesh Solanki"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.30"}
pydantic = "^2.7"
pydantic-settings = "^2.3"
lightgbm = "^4.3"
statsmodels = "^0.14"
prophet = "^1.1"
scikit-learn = "^1.5"
pandas = "^2.2"
numpy = "^1.26"
httpx = "^0.27"
asyncpg = "^0.29"
pyyaml = "^6.0"
joblib = "^1.4"
sqlalchemy = "^2.0"
alembic = "^1.13"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
ruff = "^0.4"
black = "^24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
