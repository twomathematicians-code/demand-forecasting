version: "3.9"
services:
  api:
    build: .
    image: ml-demand-forecasting:latest
    container_name: ml-demand-forecasting-api
    ports: ["8000:8000"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://mluser:mlpassword@db:5432/ml_demand_forecasting
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      db:
        condition: service_healthy
    networks: [ml-network]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: ml-demand-forecasting-db
    environment:
      - POSTGRES_USER=mluser
      - POSTGRES_PASSWORD=mlpassword
      - POSTGRES_DB=ml_demand_forecasting
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [ml-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mluser"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.0
    container_name: ml-demand-forecasting-mlflow
    ports: ["5000:5000"]
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://mluser:mlpassword@db:5432/mlflow
    volumes: [mlflow_data:/mlflow]
    depends_on: [db]
    networks: [ml-network]
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://mluser:mlpassword@db:5432/mlflow --default-artifact-root /mlflow/artifacts

volumes:
  postgres_data:
  mlflow_data:

networks:
  ml-network:
    driver: bridge
